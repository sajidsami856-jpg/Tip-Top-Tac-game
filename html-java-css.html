<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>javaLearning</title>
    <link rel="stylesheet" href="html-css-javascript.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<body>
    <div class="container">
        <h1>Currency Converter</h1>
        <form>
            <div class="amount">
                <p>Enter your amount</p>
                <input type="number" value="100">
            </div>
            <div class="dropdown">
                <div class="from">
                    <p>From</p>
                    <div class="flag">
                        <img src="https://flagsapi.com/US/flat/64.png">
                        <select name="From" id="fromCurr"></select>
                    </div>
                </div>
                <i class="fa-solid fa-arrow-right-arrow-left"></i>
                <div class="to">
                    <p>To</p>
                    <div class="flag">
                        <img src="https://flagsapi.com/BD/flat/64.png">
                        <select name="To" id="toCurr"></select>
                    </div>
                </div>
            </div>
            <div class="msg"><p>1 USD = 122.80 BDT</p></div>
            <button id="special-btn">Exchange</button>
        </form>
    </div>
    <script src="code.js"></script>
    <script src="javaaLearning.js"></script>
</body>
</html>
